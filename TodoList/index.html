<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

       <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">My To-Do List</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="todo-card mx-auto">

            <h1 class="text-center mb-2">Task Manager</h1>
            <p class="text-center text-muted">
                Organize your tasks and stay productive.
            </p>

            <div class="input-group mb-2">
                <input
                    type="text"
                    id="taskInput"
                    class="form-control"
                    placeholder="Enter a new task">

                <button id="addBtn" class="btn btn-primary">
                    Add Task
                </button>
            </div>

            <p id="errorMessage" class="text-danger"></p>

            <p class="fw-bold">
                Tasks remaining: <span id="taskCount">0</span>
            </p>

            <div class="d-flex flex-wrap gap-2 mb-3">
                <button class="btn btn-outline-primary filter-btn"
                    data-filter="all">All</button>

                <button class="btn btn-outline-primary filter-btn"
                    data-filter="active">Active</button>

                <button class="btn btn-outline-primary filter-btn"
                    data-filter="completed">Completed</button>
            </div>

            <ul id="taskList" class="list-group mb-3"></ul>

            <button id="clearCompleted"
                class="btn btn-danger w-100">
                Clear Completed
            </button>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
